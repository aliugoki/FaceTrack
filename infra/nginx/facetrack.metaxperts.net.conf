# Reverse proxy for FaceTrack — the v2 attendance system — facetrack.metaxperts.net (HTTPS)
#
# Single-origin app on 127.0.0.1:5002 (uvicorn in the `attendance-system` container,
# host networking). One backend serves everything:
#   /            → React SPA (built, mounted at FRONTEND_DIST)
#   /api/...     → FastAPI routes
#   /socket.io/  → Socket.IO realtime feed (WebSocket — needs Upgrade headers)
#
# WHY THIS EXISTS: the employee-enrollment webcam capture uses getUserMedia(), which the
# browser only exposes in a SECURE CONTEXT (HTTPS or http://localhost). Served over plain
# http://<lan-ip>:5002 the camera silently stays black. Terminating TLS here fixes it.
#
# ── Install order (cert FIRST — this config references the cert files) ───────────────
#  0) Create a DNS A record:  facetrack.metaxperts.net → 103.149.33.102  (wait for it:
#       dig +short facetrack.metaxperts.net A   →  103.149.33.102)
#  1a) Easiest (HTTP-01, port 80 is open + DNS resolves here) — let certbot issue AND
#      wire the cert into this vhost automatically:
#        sudo cp infra/nginx/facetrack.metaxperts.net.conf /etc/nginx/sites-available/facetrack.metaxperts.net
#        sudo ln -sf /etc/nginx/sites-available/facetrack.metaxperts.net /etc/nginx/sites-enabled/
#        # temporarily comment out the `ssl_*`/`listen 443` lines so nginx -t passes, OR
#        # just run the nginx plugin which manages all of it:
#        sudo certbot --nginx -d facetrack.metaxperts.net
#  1b) Or DNS-01 manual (mirrors erp.metaxperts.net; no port 80 needed):
#        sudo certbot certonly --manual --preferred-challenges dns -d facetrack.metaxperts.net
#        # add the printed TXT at _acme-challenge.facetrack.metaxperts.net, wait, press Enter
#  2) Enable + reload (if not already done by the nginx plugin):
#        sudo ln -sf /etc/nginx/sites-available/facetrack.metaxperts.net /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: --manual DNS-01 certs do NOT auto-renew; HTTP-01 via --nginx does. Use whichever
# matches how erp/register were issued on this box.

# Uniquely-named so it never collides with a map from another site (erp defines its own).
map $http_upgrade $facetrack_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name facetrack.metaxperts.net;
    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name facetrack.metaxperts.net;

    ssl_certificate     /etc/letsencrypt/live/facetrack.metaxperts.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facetrack.metaxperts.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Enrollment posts a base64 webcam JPEG (image_b64) and snapshots flow through too —
    # keep the body limit generous so captures/uploads aren't rejected.
    client_max_body_size 50m;

    # Everything is same-origin on :5002 — SPA, /api, and /socket.io alike.
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for the Socket.IO realtime feed
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $facetrack_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
